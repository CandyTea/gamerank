# GameRank — nginx front for the static site + live ranking updates.
# Replace rank.example.com and the certificate paths.
# nginx serves the files itself (fast, adds gzip) and proxies only /api/.

server {
    listen 80;
    listen [::]:80;
    server_name rank.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rank.example.com;

    ssl_certificate     /etc/nginx/ssl/rank.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/rank.example.com.key;

    root /opt/gamerank;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Never cache the shell: it carries the ?v= token for the assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/(?:app\.js|styles\.css|data/games\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # EventSource must receive each update immediately, without proxy buffering.
    location = /api/events {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
